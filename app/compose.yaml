name: biljeznica

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks: [web, app]
    depends_on: [backend]

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [app, db]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  web:
    ipam:
      config: [{subnet: 172.28.1.0/24}]
  app:
    internal: true
    ipam:
      config: [{subnet: 172.28.2.0/24}]
  db:
    internal: true
    ipam:
      config: [{subnet: 172.28.3.0/24}]

volumes:
  pgdata:
